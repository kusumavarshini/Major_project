<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuGen WebAPI Test</title>
</head>
<body>
    <h1>SecuGen WebAPI Integration Test</h1>
    
    <div id="status">Loading...</div>
    <button id="scanBtn" onclick="scanFingerprint()" disabled>Scan Fingerprint</button>
    <button id="infoBtn" onclick="getDeviceInfo()">Get Device Info</button>
    
    <div id="results" style="margin-top: 20px; font-family: monospace; white-space: pre-wrap;"></div>
    <canvas id="fpCanvas" width="300" height="400" style="border: 1px solid #ccc; margin-top: 10px;"></canvas>

    <script>
        const log = (message) => {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            results.textContent += `[${timestamp}] ${message}\n`;
        };

        const updateStatus = (message) => {
            document.getElementById('status').textContent = message;
            log(`Status: ${message}`);
        };

        // Test different SecuGen WebAPI patterns
        async function testSecuGenAPI() {
            updateStatus('Testing SecuGen WebAPI connection...');
            
            // Test 1: Direct HTTP calls to local service
            const endpoints = [
                'http://localhost:8000',
                'https://localhost:8000', 
                'http://127.0.0.1:8000',
                'https://127.0.0.1:8000'
            ];
            
            for (const endpoint of endpoints) {
                try {
                    log(`Testing endpoint: ${endpoint}`);
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    
                    const response = await fetch(endpoint, {
                        method: 'GET',
                        signal: controller.signal,
                        mode: 'cors'
                    });
                    
                    clearTimeout(timeoutId);
                    log(`Success! ${endpoint} responded with status: ${response.status}`);
                    
                    const text = await response.text();
                    log(`Response: ${text.substring(0, 200)}${text.length > 200 ? '...' : ''}`);
                    
                    updateStatus('Connected to SecuGen service');
                    document.getElementById('scanBtn').disabled = false;
                    return endpoint;
                    
                } catch (error) {
                    log(`Failed ${endpoint}: ${error.message}`);
                }
            }
            
            // Test 2: Check for SecuGen JavaScript objects/functions
            if (typeof FP_scan_display !== 'undefined') {
                log('Found FP_scan_display function');
                updateStatus('SecuGen JavaScript API available');
                document.getElementById('scanBtn').disabled = false;
                return 'javascript-api';
            }
            
            if (typeof SecuGenWebAPI !== 'undefined') {
                log('Found SecuGenWebAPI object');
                updateStatus('SecuGen JavaScript API available');
                document.getElementById('scanBtn').disabled = false;
                return 'javascript-api';
            }
            
            // Test 3: Check for WebSocket connection
            try {
                const ws = new WebSocket('ws://localhost:8000');
                ws.onopen = () => {
                    log('WebSocket connection opened');
                    updateStatus('WebSocket connection available');
                    document.getElementById('scanBtn').disabled = false;
                    ws.close();
                };
                ws.onerror = () => log('WebSocket connection failed');
            } catch (error) {
                log(`WebSocket test failed: ${error.message}`);
            }
            
            updateStatus('No SecuGen API connection found');
            return null;
        }

        // Placeholder scan function - will be updated based on discovered API
        async function scanFingerprint() {
            updateStatus('Attempting fingerprint scan...');
            log('Scan button clicked');
            
            // Try different scan methods based on what's available
            if (typeof FP_scan_display !== 'undefined') {
                try {
                    log('Attempting scan with FP_scan_display');
                    const result = FP_scan_display();
                    log(`Scan result: ${JSON.stringify(result)}`);
                } catch (error) {
                    log(`FP_scan_display error: ${error.message}`);
                }
            } else if (typeof SecuGenWebAPI !== 'undefined') {
                try {
                    log('Attempting scan with SecuGenWebAPI');
                    const api = new SecuGenWebAPI();
                    const result = await api.capture();
                    log(`Scan result: ${JSON.stringify(result)}`);
                } catch (error) {
                    log(`SecuGenWebAPI error: ${error.message}`);
                }
            } else {
                // Try HTTP API call
                try {
                    log('Attempting HTTP API scan');
                    const response = await fetch('https://localhost:8000/capture', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ timeout: 10000 })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        log(`HTTP scan result: ${JSON.stringify(result)}`);
                    } else {
                        log(`HTTP scan failed: ${response.status} ${response.statusText}`);
                    }
                } catch (error) {
                    log(`HTTP scan error: ${error.message}`);
                }
            }
        }

        async function getDeviceInfo() {
            log('Getting device information...');
            
            // Try various methods to get device info
            const methods = [
                { name: 'HTTP GET /info', url: 'https://localhost:8000/info' },
                { name: 'HTTP GET /device', url: 'https://localhost:8000/device' },
                { name: 'HTTP GET /status', url: 'https://localhost:8000/status' },
                { name: 'HTTP GET /', url: 'https://localhost:8000/' }
            ];
            
            for (const method of methods) {
                try {
                    log(`Trying: ${method.name}`);
                    const controller = new AbortController();
                    setTimeout(() => controller.abort(), 2000);
                    
                    const response = await fetch(method.url, {
                        signal: controller.signal,
                        mode: 'cors'
                    });
                    
                    log(`${method.name} - Status: ${response.status}`);
                    const text = await response.text();
                    log(`${method.name} - Response: ${text.substring(0, 100)}`);
                    
                } catch (error) {
                    log(`${method.name} - Error: ${error.message}`);
                }
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            log('Page loaded, initializing SecuGen WebAPI test');
            testSecuGenAPI();
        });
    </script>
</body>
</html>
